<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Douban Top 250 Movie Analysis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            margin: 0;
            font-size: 2em;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            text-align: center;
        }
        nav ul li {
            margin: 10px 0;
        }
        nav ul li a {
            text-decoration: none;
            color: #337ab7;
            font-size: 1.2em;
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
            transition: background-color 0.3s, color 0.3s;
        }
        nav ul li a:hover, nav ul li a:focus {
            background-color: #337ab7;
            color: #fff;
            border-color: #2e6da4;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <header>
        <h1>Douban Top 250 Movie Analysis</h1>
    </header>
    <div class="container">
        <nav>
            <ul>
                <li><a href="/charts/movies_by_year">Movies by Year</a></li>
                <li><a href="/charts/movies_by_country">Movies by Country (Top 10)</a></li>
                <li><a href="/charts/movies_by_genre">Movies by Genre</a></li>
                <li><a href="/charts/avg_rating_by_year">Average Rating by Year</a></li>
                <li><a href="/charts/rating_distribution">Distribution of Ratings</a></li>
            </ul>
        </nav>
    </div>
</body>
</html>
